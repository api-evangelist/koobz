aid: koobz
name: Koobz
description: 'Koobz is a Ventura, California additive-manufacturing company rebuilding the footwear
  supply chain around on-demand 3D printing. Its "gigafactory" prints circular-ready, mono-material
  foamed-TPU shoes to order, so brands carry zero inventory and face no minimum order quantities:
  a consumer buys on the brand''s own storefront, the order and personalization specs sync to the
  Koobz factory, the shoe is printed in Ventura and dropshipped direct to the customer in days.
  The company markets 10x faster concept-to-market cycles (4-6 weeks, no tooling), custom
  cushioning and foot-scanning personalization, and a KoobzWeave toolpath-as-textile upper pattern
  engine. Its mono-material architecture is positioned for Extended Producer Responsibility regimes
  such as California SB 707, since a single-polymer shoe yields premium TPU on take-back rather than
  mixed waste. Koobz has raised $7.2M and is backed by Uncork Capital. It describes its factory as
  API-driven and its order intake as an API sync from brand storefronts, but as of this profile it
  publishes no public developer portal, API documentation, or machine-readable API definition;
  integration appears to run through its partner ("Partner With Us") channel.'
